  <rect x="496" y="161" width="46" height="7" rx="3.5" fill="#5A6482" opacity="0.75"/>
  <rect x="496" y="171" width="74" height="5" rx="2.5" fill="#8A94B0" opacity="0.5"/>

  <rect x="480" y="186" width="130" height="26" rx="7" fill="#FFFFFF"/>
  <path d="M490 194 487 206" stroke="#8A94B0" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="496" y="193" width="64" height="7" rx="3.5" fill="#5A6482" opacity="0.75"/>
  <rect x="496" y="203" width="58" height="5" rx="2.5" fill="#8A94B0" opacity="0.5"/>

  <circle cx="598" cy="222" r="10" fill="url(#sms-accent)"/>
  <path d="m594 222 3 3 5-6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
